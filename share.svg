<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <!-- Source for share.png (the social share preview). Edit this, then re-export a 1200×630 PNG. -->
  <rect width="1200" height="630" fill="#1d2340"/>
  <g fill="#ffd84d" opacity=".9">
    <rect x="905" y="70" width="14" height="20" rx="3" transform="rotate(25 912 80)"/>
    <rect x="1080" y="120" width="14" height="20" rx="3" fill="#4dd4ff" transform="rotate(-30 1087 130)"/>
    <rect x="690" y="110" width="14" height="20" rx="3" fill="#ff6b6b" transform="rotate(40 697 120)"/>
    <rect x="1120" y="300" width="14" height="20" rx="3" fill="#7dff8a" transform="rotate(15 1127 310)"/>
    <rect x="660" y="330" width="14" height="20" rx="3" fill="#c38bff" transform="rotate(-20 667 340)"/>
  </g>

  <!-- logo + title -->
  <g transform="translate(80 92)">
    <circle cx="36" cy="36" r="30" fill="none" stroke="#ffd84d" stroke-width="8"/>
    <circle cx="36" cy="36" r="15" fill="none" stroke="#fff" stroke-width="7"/>
    <circle cx="36" cy="36" r="5" fill="#ffd84d"/>
  </g>
  <text x="80" y="250" fill="#ffffff" font-size="76" font-weight="800" letter-spacing="-1.5">Recitation</text>
  <text x="80" y="336" fill="#ffffff" font-size="76" font-weight="800" letter-spacing="-1.5">Picker</text>
  <text x="80" y="404" fill="#c9ccd8" font-size="30" font-weight="500">Call on students fairly.</text>
  <text x="80" y="444" fill="#c9ccd8" font-size="30" font-weight="500">Track participation.</text>

  <!-- privacy line -->
  <g transform="translate(80 512)">
    <rect width="470" height="54" rx="27" fill="#2b3360"/>
    <g transform="translate(24 13)" fill="none" stroke="#ffd84d" stroke-width="3">
      <rect x="1" y="12" width="22" height="16" rx="3" fill="#ffd84d" stroke="none"/>
      <path d="M6 12 V8 a6 6 0 0 1 12 0 V12"/>
    </g>
    <text x="62" y="35" fill="#ffffff" font-size="23" font-weight="600">Names stay on your computer</text>
  </g>

  <!-- mock "picked" card -->
  <g transform="translate(640 170)">
    <rect width="480" height="330" rx="26" fill="#0f1430" stroke="#38407a" stroke-width="2"/>
    <text x="240" y="62" fill="#c9ccd8" font-size="20" text-anchor="middle">PA 106 · 12 of 30 called</text>
    <text x="240" y="150" fill="#ffd84d" font-size="62" font-weight="800" text-anchor="middle" letter-spacing="-1">Santos, Maria</text>
    <g font-size="20" font-weight="700" fill="#fff" text-anchor="middle">
      <rect x="28" y="200" width="200" height="48" rx="12" fill="#1a7a43"/><text x="128" y="231">Answered well</text>
      <rect x="252" y="200" width="200" height="48" rx="12" fill="#2a62c4"/><text x="352" y="231">Answered</text>
      <rect x="28" y="260" width="200" height="48" rx="12" fill="#9a5b0b"/><text x="128" y="291">Passed</text>
      <rect x="252" y="260" width="200" height="48" rx="12" fill="#5f6570"/><text x="352" y="291">Absent</text>
    </g>
  </g>
</svg>
